<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">QWERTY luxury sports car</title>
  <desc id="description">A sleek silver sports car on a dark road at sunset.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset=".55" stop-color="#482f46"/>
      <stop offset="1" stop-color="#f19b50"/>
    </linearGradient>
